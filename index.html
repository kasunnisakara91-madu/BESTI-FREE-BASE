<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NOVIX MD DCT</title>

<style>

/* ==================================================
   RESET
================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    background: #000;
    color: #22ff68;
    font-family: "Courier New", monospace;
    overflow-x: hidden;
}


/* ==================================================
   BACKGROUND IMAGE
================================================== */

#backgroundImage {
    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    object-position: center center;

    z-index: -20;

    filter:
        brightness(0.60)
        contrast(1.04)
        saturate(0.95);
}


/* ==================================================
   DARK OVERLAY
   No heavy green color
================================================== */

.darkOverlay {
    position: fixed;

    inset: 0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,0.18),
            rgba(0,0,0,0.62)
        );

    z-index: -19;

    pointer-events: none;
}


/* ==================================================
   VERY LIGHT GREEN ATMOSPHERE
================================================== */

.greenGlow {
    position: fixed;

    inset: 0;

    background:
        radial-gradient(
            circle at center,
            rgba(0,255,80,0.025),
            transparent 65%
        );

    z-index: -18;

    pointer-events: none;
}


/* ==================================================
   SCANLINES
================================================== */

.scanlines {
    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: 100;

    background:
        repeating-linear-gradient(
            0deg,
            rgba(0,255,80,0.015) 0px,
            rgba(0,255,80,0.015) 1px,
            transparent 1px,
            transparent 4px
        );
}


/* ==================================================
   🌸 FULL SCREEN FLOWER RAIN
================================================== */

#flowerRain {
    position: fixed;

    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    pointer-events: none;

    z-index: 80;
}


/* ==================================================
   FLOWER
================================================== */

.flower {
    position: absolute;

    top: -80px;

    left: 0;

    width: 15px;
    height: 10px;

    border-radius:
        100% 0 100% 0;

    opacity: 0;

    transform-origin: center;

    filter:
        drop-shadow(
            0 1px 2px
            rgba(0,0,0,0.35)
        );

    animation:
        flowerFall
        linear
        forwards;

    will-change:
        transform,
        opacity;
}


/* ==================================================
   FLOWER HIGHLIGHT
================================================== */

.flower::after {
    content: "";

    position: absolute;

    width: 4px;
    height: 3px;

    left: 27%;
    top: 23%;

    border-radius: 50%;

    background:
        rgba(255,255,255,0.55);
}


/* ==================================================
   NATURAL FALL ANIMATION
================================================== */

@keyframes flowerFall {

    0% {

        opacity: 0;

        transform:
            translate3d(
                0,
                -80px,
                0
            )
            rotate(0deg)
            scale(0.65);
    }


    7% {

        opacity: 0.88;
    }


    18% {

        transform:
            translate3d(
                var(--wind1),
                18vh,
                0
            )
            rotate(100deg)
            scale(0.90);
    }


    35% {

        transform:
            translate3d(
                var(--wind2),
                35vh,
                0
            )
            rotate(210deg)
            scale(1.05);
    }


    52% {

        transform:
            translate3d(
                var(--wind3),
                52vh,
                0
            )
            rotate(330deg)
            scale(0.90);
    }


    70% {

        transform:
            translate3d(
                var(--wind4),
                70vh,
                0
            )
            rotate(460deg)
            scale(1.08);
    }


    87% {

        transform:
            translate3d(
                var(--wind5),
                87vh,
                0
            )
            rotate(570deg)
            scale(0.86);
    }


    100% {

        opacity: 0;

        transform:
            translate3d(
                var(--wind6),
                115vh,
                0
            )
            rotate(700deg)
            scale(0.70);
    }
}


/* ==================================================
   HEADER
================================================== */

header {
    position: relative;

    width: 100%;

    text-align: center;

    padding:
        35px 15px 20px;

    z-index: 10;
}


.glitch {
    font-size:
        clamp(30px, 7vw, 58px);

    font-weight: bold;

    line-height: 1.2;

    color: #22ff68;

    letter-spacing: 2px;

    text-shadow:
        2px 0 #ff1744,
        -2px 0 #00e5ff,
        0 0 7px
        rgba(0,255,80,0.65);
}


.dct {
    margin-top: 5px;

    font-size:
        clamp(28px, 6vw, 48px);

    font-weight: bold;

    color: #22ff68;

    text-shadow:
        2px 0 #ff1744,
        -2px 0 #00e5ff,
        0 0 7px
        rgba(0,255,80,0.65);
}


.subtitle {
    margin-top: 12px;

    font-size:
        clamp(16px, 4vw, 25px);

    letter-spacing: 3px;

    color: #22ff68;

    text-shadow:
        0 0 6px
        rgba(0,255,80,0.55);
}


/* ==================================================
   MAIN CONTAINER
================================================== */

.container {
    position: relative;

    width:
        min(92%, 650px);

    margin:
        25px auto 70px;

    z-index: 10;
}


/* ==================================================
   MAIN CARD
================================================== */

.card {

    background:
        rgba(0,0,0,0.77);

    border:
        2px solid
        rgba(34,255,104,0.92);

    border-radius:
        28px;

    padding:
        40px 20px 50px;

    box-shadow:

        0 0 7px
        rgba(0,255,80,0.55),

        0 0 20px
        rgba(0,255,80,0.14),

        inset 0 0 18px
        rgba(0,255,80,0.025);

    backdrop-filter:
        blur(2px);
}


/* ==================================================
   TITLE
================================================== */

.title {

    text-align: center;

    font-size:
        clamp(25px, 6.5vw, 45px);

    line-height: 1.3;

    color: #22ff68;

    text-shadow:
        2px 0 #ff1744,
        -2px 0 #00e5ff,
        0 0 7px
        rgba(0,255,80,0.65);

    margin-bottom:
        28px;
}


/* ==================================================
   STATUS
================================================== */

.status {

    width: 92%;

    margin:
        0 auto 30px;

    font-size:
        clamp(15px, 4vw, 21px);

    line-height: 1.9;

    letter-spacing: 1px;
}


.online {
    color: #22ff68;

    text-shadow:
        0 0 6px
        rgba(0,255,80,0.65);
}


/* ==================================================
   BOT BOX
================================================== */

.bot-box {

    width: 96%;

    margin:
        25px auto;

    padding:
        27px 18px 30px;

    text-align: center;

    background:
        rgba(0,0,0,0.68);

    border:
        2px solid
        rgba(34,255,104,0.90);

    border-radius:
        20px;

    box-shadow:

        0 0 7px
        rgba(0,255,80,0.45),

        0 0 18px
        rgba(0,255,80,0.11);

    transition:
        0.25s;
}


.bot-box:hover {

    transform:
        translateY(-3px);

    box-shadow:

        0 0 11px
        rgba(0,255,80,0.65),

        0 0 23px
        rgba(0,255,80,0.18);
}


/* ==================================================
   BOT TITLE
================================================== */

.bot-title {

    font-size:
        clamp(20px, 5vw, 28px);

    color:
        #22ff68;

    margin-bottom:
        18px;

    text-shadow:
        2px 0 #ff1744,
        -2px 0 #00e5ff;
}


/* ==================================================
   BOT STATUS
================================================== */

.bot-status {

    font-size:
        clamp(15px, 4vw, 19px);

    margin-bottom:
        22px;
}


.ready {

    color:
        #22ff68;

    text-shadow:
        0 0 6px
        rgba(0,255,80,0.65);
}


/* ==================================================
   DEPLOY BUTTON
================================================== */

.deploy-btn {

    display:
        block;

    width:
        100%;

    padding:
        16px 10px;

    color:
        #22ff68;

    background:
        rgba(0,0,0,0.50);

    border:
        2px solid
        #22ff68;

    border-radius:
        10px;

    text-decoration:
        none;

    font-family:
        "Courier New",
        monospace;

    font-size:
        clamp(15px, 4vw, 20px);

    letter-spacing:
        1px;

    transition:
        0.25s;
}


.deploy-btn:hover {

    background:
        #22ff68;

    color:
        #000;

    box-shadow:
        0 0 12px
        #22ff68;
}


.deploy-btn:active {

    transform:
        scale(0.97);
}


/* ==================================================
   GENDER
================================================== */

.gender-box {

    text-align:
        center;

    margin-top:
        38px;
}


.gender-title {

    font-size:
        clamp(18px, 4vw, 24px);

    margin-bottom:
        16px;
}


.gender-box label {

    font-size:
        clamp(16px, 4vw, 22px);

    margin:
        0 8px;

    cursor:
        pointer;
}


.gender-box input {

    width:
        26px;

    height:
        26px;

    vertical-align:
        middle;

    margin-right:
        7px;

    accent-color:
        #22ff68;
}


/* ==================================================
   MESSAGE
================================================== */

#message {

    min-height:
        25px;

    margin-top:
        25px;

    text-align:
        center;

    font-size:
        15px;

    color:
        #22ff68;

    text-shadow:
        0 0 7px
        rgba(0,255,80,0.65);
}


/* ==================================================
   MOBILE
================================================== */

@media (max-width: 480px) {

    header {
        padding-top:
            25px;
    }

    .container {

        width:
            94%;

        margin-top:
            15px;
    }

    .card {

        padding:
            32px 13px 40px;

        border-radius:
            24px;
    }

    .status {
        width:
            96%;
    }

    .bot-box {
        width:
            98%;
    }

}

</style>
</head>


<body>


<!-- ==================================================
     BACKGROUND
================================================== -->

<img
    id="backgroundImage"
    src="./bg.jpg"
    alt=""
>

<div class="darkOverlay"></div>

<div class="greenGlow"></div>

<div class="scanlines"></div>


<!-- ==================================================
     FLOWER RAIN CONTAINER
================================================== -->

<div id="flowerRain"></div>



<!-- ==================================================
     HEADER
================================================== -->

<header>

    <div class="glitch">
        I AM : ( NOVIX MD )
    </div>

    <div class="dct">
        DCT
    </div>

    <div class="subtitle">
        [ NOVIX MD DCT ]
    </div>

</header>



<!-- ==================================================
     MAIN
================================================== -->

<div class="container">

    <div class="card">


        <div class="title">
            I AM : ( NOVIX MD ) DCT
        </div>


        <div class="status">

            &gt; SYSTEM STATUS:
            <span class="online">
                ONLINE
            </span>

            <br>

            &gt; ACCESS LEVEL:
            <span class="online">
                ROOT
            </span>

        </div>



        <!-- ==================================================
             BOT 01
        ================================================== -->

        <div class="bot-box">

            <div class="bot-title">
                NOVIX MD BOT 01
            </div>

            <div class="bot-status">

                &gt; BOT STATUS:
                <span class="ready">
                    READY
                </span>

            </div>


            <!--
                PUT YOUR BOT LINK HERE
            -->

            <a
                href="https://YOUR-BOT-LINK-1.com"
                target="_blank"
                rel="noopener noreferrer"
                class="deploy-btn"
            >

                &gt;&gt; DEPLOY BOT 01

            </a>

        </div>



        <!-- ==================================================
             BOT 02
        ================================================== -->

        <div class="bot-box">

            <div class="bot-title">
                NOVIX MD BOT 02
            </div>

            <div class="bot-status">

                &gt; BOT STATUS:
                <span class="ready">
                    READY
                </span>

            </div>


            <!--
                PUT YOUR SECOND BOT LINK HERE
            -->

            <a
                href="https://YOUR-BOT-LINK-2.com"
                target="_blank"
                rel="noopener noreferrer"
                class="deploy-btn"
            >

                &gt;&gt; DEPLOY BOT 02

            </a>

        </div>



        <!-- ==================================================
             GENDER
        ================================================== -->

        <div class="gender-box">

            <div class="gender-title">
                Select Gender:
            </div>


            <label>

                <input
                    type="radio"
                    name="gender"
                    value="Male"
                >

                Male

            </label>


            <label>

                <input
                    type="radio"
                    name="gender"
                    value="Female"
                >

                Female

            </label>

        </div>


        <div id="message"></div>


    </div>

</div>



<script>

/* ==================================================
   🌸 FULL SCREEN NATURAL FLOWER RAIN
================================================== */

const flowerRain =
    document.getElementById(
        "flowerRain"
    );


/* Different realistic pink shades */

const flowerColors = [

    ["#fff5f8", "#ffbfd2", "#e85b87"],

    ["#ffe8f0", "#ff9fbe", "#d94e7b"],

    ["#ffd9e5", "#ff89ae", "#ca416e"],

    ["#fff0f5", "#ffaac4", "#df547e"],

    ["#ffe1eb", "#ff94b6", "#d44977"]

];


/* ==================================================
   CREATE FLOWER
================================================== */

function createFlower() {

    const flower =
        document.createElement(
            "div"
        );


    flower.className =
        "flower";


    /* ==================================================
       RANDOM X POSITION
       0 - 100% SCREEN
    ================================================== */

    flower.style.left =
        (
            Math.random() * 100
        ) + "vw";


    /* ==================================================
       RANDOM SIZE
    ================================================== */

    const size =
        7 +
        Math.random() * 15;


    flower.style.width =
        size + "px";


    flower.style.height =
        (
            size *
            (
                0.55 +
                Math.random() * 0.25
            )
        ) + "px";


    /* ==================================================
       RANDOM SPEED
    ================================================== */

    const duration =
        5.5 +
        Math.random() * 7;


    flower.style.animationDuration =
        duration + "s";


    /* ==================================================
       RANDOM OPACITY
    ================================================== */

    flower.style.opacity =
        0.48 +
        Math.random() * 0.45;


    /* ==================================================
       RANDOM COLOR
    ================================================== */

    const colors =
        flowerColors[
            Math.floor(
                Math.random() *
                flowerColors.length
            )
        ];


    flower.style.background =
        "radial-gradient(" +
        "ellipse at 30% 30%, " +

        colors[0] +
        " 0%, " +

        colors[1] +
        " 48%, " +

        colors[2] +
        " 100%)";


    /* ==================================================
       RANDOM WIND PATH
       Every flower gets a different movement
    ================================================== */

    const wind1 =
        (-35 + Math.random() * 70)
        .toFixed(0) + "px";


    const wind2 =
        (-55 + Math.random() * 110)
        .toFixed(0) + "px";


    const wind3 =
        (-70 + Math.random() * 140)
        .toFixed(0) + "px";


    const wind4 =
        (-55 + Math.random() * 110)
        .toFixed(0) + "px";


    const wind5 =
        (-75 + Math.random() * 150)
        .toFixed(0) + "px";


    const wind6 =
        (-50 + Math.random() * 100)
        .toFixed(0) + "px";


    flower.style.setProperty(
        "--wind1",
        wind1
    );

    flower.style.setProperty(
        "--wind2",
        wind2
    );

    flower.style.setProperty(
        "--wind3",
        wind3
    );

    flower.style.setProperty(
        "--wind4",
        wind4
    );

    flower.style.setProperty(
        "--wind5",
        wind5
    );

    flower.style.setProperty(
        "--wind6",
        wind6
    );


    /* ==================================================
       RANDOM START ROTATION
    ================================================== */

    const rotation =
        Math.random() * 360;


    flower.style.transform =
        "rotate(" +
        rotation +
        "deg)";


    /* ==================================================
       ADD TO SCREEN
    ================================================== */

    flowerRain.appendChild(
        flower
    );


    /* ==================================================
       REMOVE AFTER FALL
    ================================================== */

    setTimeout(
        function() {

            if (
                flower.parentNode
            ) {

                flower.remove();

            }

        },
        (
            duration +
            2
        ) * 1000
    );
}


/* ==================================================
   INITIAL FLOWERS
   Spread across the whole screen
================================================== */

for (
    let i = 0;
    i < 55;
    i++
) {

    setTimeout(
        createFlower,
        Math.random() * 6000
    );

}


/* ==================================================
   CONTINUOUS FLOWER RAIN
================================================== */

setInterval(
    createFlower,
    190
);


/* ==================================================
   GENDER SELECTION
================================================== */

const genderInputs =
    document.querySelectorAll(
        'input[name="gender"]'
    );


genderInputs.forEach(
    function(input) {

        input.addEventListener(
            "change",
            function() {

                document
                    .getElementById(
                        "message"
                    )
                    .innerHTML =
                    "&gt; GENDER SELECTED: " +
                    this.value.toUpperCase();

            }
        );

    }
);

</script>


</body>
</html>
