<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NOVIX MD DCT</title>

<style>

/* =========================
   RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    font-family: "Courier New", monospace;
    background: #000;
    color: #20ff62;
    overflow-x: hidden;
}


/* =========================
   BACKGROUND
========================= */

body::before {
    content: "";

    position: fixed;
    inset: 0;

    background:
        linear-gradient(
            rgba(0, 0, 0, 0.42),
            rgba(0, 0, 0, 0.68)
        ),
        url("logopng.jpg")
        center center /
        cover
        no-repeat;

    z-index: -3;

    transform: scale(1.02);
}


/* =========================
   SOFT GREEN GLOW
========================= */

.glow {
    position: fixed;
    inset: 0;

    pointer-events: none;

    z-index: -1;

    background:
        radial-gradient(
            circle at center,
            rgba(0, 255, 70, 0.07),
            transparent 58%
        );
}


/* =========================
   SCANLINES
========================= */

.scanlines {
    position: fixed;
    inset: 0;

    pointer-events: none;

    z-index: 50;

    background:
        repeating-linear-gradient(
            0deg,
            rgba(0, 255, 80, 0.02) 0px,
            rgba(0, 255, 80, 0.02) 1px,
            transparent 1px,
            transparent 4px
        );
}


/* =========================
   NATURAL SAKURA PETALS
========================= */

#petals {
    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    pointer-events: none;

    z-index: 20;
}


.petal {
    position: absolute;

    top: -40px;

    left: 0;

    width: 13px;
    height: 8px;

    border-radius:
        100% 0 100% 0;

    opacity: 0.75;

    filter:
        drop-shadow(
            0 1px 2px
            rgba(0,0,0,0.35)
        );

    transform-origin:
        center;

    animation:
        naturalFall
        linear
        forwards;
}


/* Small highlight on petal */

.petal::after {
    content: "";

    position: absolute;

    width: 45%;
    height: 100%;

    left: 50%;
    top: 0;

    border-radius: 50%;

    background:
        rgba(255,255,255,0.16);

    transform:
        rotate(20deg);
}


/* Natural falling movement */

@keyframes naturalFall {

    0% {

        transform:
            translate3d(
                0,
                -40px,
                0
            )
            rotate(0deg)
            scale(0.8);

        opacity: 0;
    }


    8% {

        opacity: 0.82;
    }


    25% {

        transform:
            translate3d(
                55px,
                25vh,
                0
            )
            rotate(130deg)
            scale(1);
    }


    45% {

        transform:
            translate3d(
                -45px,
                48vh,
                0
            )
            rotate(250deg)
            scale(0.9);
    }


    65% {

        transform:
            translate3d(
                70px,
                70vh,
                0
            )
            rotate(390deg)
            scale(1.05);
    }


    82% {

        transform:
            translate3d(
                -35px,
                88vh,
                0
            )
            rotate(510deg)
            scale(0.85);
    }


    100% {

        transform:
            translate3d(
                40px,
                110vh,
                0
            )
            rotate(680deg)
            scale(0.75);

        opacity: 0;
    }
}


/* =========================
   HEADER
========================= */

header {

    width: 100%;

    text-align: center;

    padding:
        35px 15px 20px;
}


.glitch {

    font-size:
        clamp(
            30px,
            7vw,
            60px
        );

    font-weight: bold;

    color:
        #20ff62;

    letter-spacing:
        2px;

    text-shadow:
        2px 0 #ff1744,
        -2px 0 #00e5ff,
        0 0 8px #00ff55;

    animation:
        flicker 3s infinite;
}


.dct {

    margin-top:
        5px;

    font-size:
        clamp(
            28px,
            6vw,
            48px
        );

    font-weight:
        bold;

    color:
        #20ff62;

    text-shadow:
        2px 0 #ff1744,
        -2px 0 #00e5ff,
        0 0 8px #00ff55;
}


.subtitle {

    margin-top:
        12px;

    font-size:
        clamp(
            16px,
            4vw,
            25px
        );

    letter-spacing:
        2px;

    text-shadow:
        0 0 8px #00ff55;
}


/* =========================
   MAIN CONTAINER
========================= */

.container {

    width:
        min(92%, 650px);

    margin:
        30px auto 70px;
}


/* =========================
   MAIN CARD
========================= */

.card {

    background:
        rgba(0,0,0,0.80);

    border:
        2px solid #20ff62;

    border-radius:
        30px;

    padding:
        40px 22px 50px;

    box-shadow:

        0 0 8px
        rgba(0,255,80,0.75),

        0 0 22px
        rgba(0,255,80,0.22),

        inset 0 0 18px
        rgba(0,255,80,0.035);

    backdrop-filter:
        blur(3px);
}


/* =========================
   TITLE
========================= */

.title {

    text-align:
        center;

    font-size:
        clamp(
            27px,
            7vw,
            47px
        );

    line-height:
        1.2;

    color:
        #20ff62;

    text-shadow:

        2px 0 #ff1744,
        -2px 0 #00e5ff,
        0 0 8px #00ff55;

    margin-bottom:
        25px;
}


/* =========================
   STATUS
========================= */

.status {

    width:
        92%;

    margin:
        auto auto 30px;

    font-size:
        clamp(
            15px,
            4vw,
            21px
        );

    line-height:
        1.8;

    letter-spacing:
        1px;
}


.online {

    color:
        #20ff62;

    text-shadow:
        0 0 7px #00ff55;
}


/* =========================
   BOT BOXES
========================= */

.bot-boxes {

    width:
        100%;

    margin-top:
        20px;
}


.bot-box {

    width:
        95%;

    margin:
        22px auto;

    padding:
        25px 18px;

    background:
        rgba(0,0,0,0.70);

    border:
        2px solid #20ff62;

    border-radius:
        18px;

    text-align:
        center;

    box-shadow:

        0 0 7px
        rgba(0,255,80,0.65),

        0 0 18px
        rgba(0,255,80,0.18),

        inset 0 0 15px
        rgba(0,255,80,0.035);

    transition:
        0.25s;
}


.bot-box:hover {

    transform:
        translateY(-3px);

    box-shadow:

        0 0 12px
        rgba(0,255,80,0.8),

        0 0 25px
        rgba(0,255,80,0.25);
}


/* BOT TITLE */

.bot-box h2 {

    color:
        #20ff62;

    font-size:
        clamp(
            20px,
            5vw,
            27px
        );

    margin-bottom:
        16px;

    text-shadow:

        2px 0 #ff1744,
        -2px 0 #00e5ff;
}


/* BOT STATUS */

.bot-status {

    font-size:
        16px;

    margin-bottom:
        20px;
}


.ready {

    color:
        #20ff62;

    text-shadow:
        0 0 7px #00ff55;
}


/* =========================
   DEPLOY BUTTON
========================= */

.deploy-btn {

    display:
        block;

    width:
        100%;

    padding:
        15px 10px;

    text-decoration:
        none;

    color:
        #20ff62;

    background:
        rgba(0,0,0,0.55);

    border:
        2px solid #20ff62;

    border-radius:
        9px;

    font-family:
        "Courier New",
        monospace;

    font-size:
        clamp(
            15px,
            4vw,
            20px
        );

    letter-spacing:
        1px;

    transition:
        0.25s;
}


.deploy-btn:hover {

    background:
        #20ff62;

    color:
        #000;

    box-shadow:

        0 0 12px
        #00ff55,

        0 0 25px
        #00ff55;

    transform:
        scale(1.02);
}


.deploy-btn:active {

    transform:
        scale(0.97);
}


/* =========================
   GENDER
========================= */

.gender-box {

    text-align:
        center;

    margin-top:
        35px;
}


.gender-title {

    font-size:
        clamp(
            18px,
            4vw,
            24px
        );

    margin-bottom:
        15px;
}


.gender-box label {

    font-size:
        clamp(
            16px,
            4vw,
            22px
        );

    margin:
        0 8px;

    cursor:
        pointer;
}


.gender-box input {

    width:
        27px;

    height:
        27px;

    vertical-align:
        middle;

    margin-right:
        7px;

    accent-color:
        #20ff62;
}


/* =========================
   MESSAGE
========================= */

#message {

    min-height:
        25px;

    margin-top:
        25px;

    text-align:
        center;

    font-size:
        16px;

    color:
        #20ff62;

    text-shadow:
        0 0 8px #00ff55;
}


/* =========================
   FLICKER
========================= */

@keyframes flicker {

    0%,
    18%,
    20%,
    22%,
    64%,
    66%,
    100% {

        opacity: 1;
    }


    19%,
    21%,
    65% {

        opacity: 0.65;
    }

}


/* =========================
   MOBILE
========================= */

@media (max-width: 480px) {

    header {

        padding-top:
            25px;
    }


    .card {

        padding:
            35px 14px 40px;

        border-radius:
            25px;
    }


    .container {

        margin-top:
            15px;
    }


    .status {

        width:
            96%;
    }


    .bot-box {

        width:
            97%;
    }

}

</style>
</head>


<body>


<!-- EFFECT LAYERS -->

<div class="glow"></div>

<div class="scanlines"></div>

<div id="petals"></div>



<!-- =========================
     HEADER
========================= -->

<header>

    <div class="glitch">
        I AM : ( NOVIX MD )
    </div>

    <div class="dct">
        DCT
    </div>

    <div class="subtitle">
        [ NOVIX MD DCT ]
    </div>

</header>



<!-- =========================
     MAIN
========================= -->

<div class="container">

    <div class="card">


        <!-- TITLE -->

        <div class="title">
            I AM : ( NOVIX MD ) DCT
        </div>



        <!-- STATUS -->

        <div class="status">

            &gt; SYSTEM STATUS:
            <span class="online">
                ONLINE
            </span>

            <br>

            &gt; ACCESS LEVEL:
            <span class="online">
                ROOT
            </span>

        </div>



        <!-- =========================
             BOT BOXES
        ========================= -->

        <div class="bot-boxes">


            <!-- BOT 01 -->

            <div class="bot-box">

                <h2>
                    NOVIX MD BOT 01
                </h2>

                <div class="bot-status">

                    &gt; BOT STATUS:
                    <span class="ready">
                        READY
                    </span>

                </div>


                <!-- CHANGE BOT LINK -->

                <a
                    href="https://YOUR-BOT-LINK-1.com"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="deploy-btn"
                >

                    &gt;&gt; DEPLOY BOT 01

                </a>

            </div>



            <!-- BOT 02 -->

            <div class="bot-box">

                <h2>
                    NOVIX MD BOT 02
                </h2>

                <div class="bot-status">

                    &gt; BOT STATUS:
                    <span class="ready">
                        READY
                    </span>

                </div>


                <!-- CHANGE BOT LINK -->

                <a
                    href="https://YOUR-BOT-LINK-2.com"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="deploy-btn"
                >

                    &gt;&gt; DEPLOY BOT 02

                </a>

            </div>


        </div>



        <!-- =========================
             GENDER
        ========================= -->

        <div class="gender-box">

            <div class="gender-title">
                Select Gender:
            </div>


            <label>

                <input
                    type="radio"
                    name="gender"
                    value="Male"
                >

                Male

            </label>


            <label>

                <input
                    type="radio"
                    name="gender"
                    value="Female"
                >

                Female

            </label>

        </div>



        <div id="message"></div>


    </div>

</div>



<!-- =========================
     JAVASCRIPT
========================= -->

<script>


/* =========================
   SAKURA PETAL SYSTEM
========================= */

const petals =
    document.getElementById(
        "petals"
    );


const petalColors = [

    "#ffd1df",
    "#ffb4ca",
    "#ff9fbd",
    "#f985aa",
    "#e96891",
    "#ffc5d7"

];


function createPetal() {


    const petal =
        document.createElement(
            "div"
        );


    petal.className =
        "petal";


    /* Random horizontal position */

    petal.style.left =
        Math.random() * 100 +
        "vw";


    /* Random size */

    const size =
        7 +
        Math.random() * 10;


    petal.style.width =
        size + "px";


    petal.style.height =
        size *
        (
            0.55 +
            Math.random() * 0.25
        ) +
        "px";


    /* Random falling speed */

    const duration =
        7 +
        Math.random() * 8;


    petal.style.animationDuration =
        duration + "s";


    /* Random opacity */

    petal.style.opacity =
        0.45 +
        Math.random() * 0.4;


    /* Random pink color */

    const color =
        petalColors[
            Math.floor(
                Math.random() *
                petalColors.length
            )
        ];


    petal.style.background =
        "linear-gradient(" +
        "135deg," +
        color +
        ",#d94d7b)";


    /* Random starting position */

    petal.style.transform =
        "rotate(" +
        Math.random() * 360 +
        "deg)";


    petals.appendChild(
        petal
    );


    /* Remove old petals */

    setTimeout(
        function() {

            petal.remove();

        },
        (duration + 1) * 1000
    );

}


/* Initial petals */

for (
    let i = 0;
    i < 18;
    i++
) {

    setTimeout(
        createPetal,
        Math.random() * 5000
    );

}


/* Continuous petals */

setInterval(
    createPetal,
    350
);



/* =========================
   GENDER SELECT
========================= */

const genderInputs =
    document.querySelectorAll(
        'input[name="gender"]'
    );


genderInputs.forEach(
    function(input) {

        input.addEventListener(
            "change",
            function() {

                document
                    .getElementById(
                        "message"
                    )
                    .innerHTML =
                    "&gt; GENDER SELECTED: " +
                    this.value.toUpperCase();

            }
        );

    }
);

</script>


</body>
  </html>
